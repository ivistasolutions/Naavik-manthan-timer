<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speaker Timer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    /* Drawn from the Naavik Manthan mark: charcoal #2e393f, sand #c9cbb6, sky #83d1dd, wave #28acdd / #1563a1 */
    --bg: #071820;
    --panel: #102838;
    --grid-line: #1c4258;
    --text-primary: #f3f7fa;
    --text-muted: #8eb4c6;
    --text-faint: #5d8496;
    --sand: #c9cbb6;
    --c-safe: #2eb6e6;
    --c-safe-dim: #0c3348;
    --c-warn: #e4c56a;
    --c-warn-dim: #3d3416;
    --c-alert: #f0a04a;
    --c-alert-dim: #3d2a12;
    --c-critical: #f25b5b;
    --c-critical-dim: #4a1818;
    --state-color: var(--c-safe);
    --state-dim: var(--c-safe-dim);
    --focus: #83d1dd;
    --ink: #071820;
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
  }

  body{
    margin: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .stage{
    position: relative;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(ellipse 46% 30% at 50% 14%, color-mix(in srgb, var(--sand) 28%, transparent), transparent 72%),
      radial-gradient(ellipse 72% 52% at 50% 40%, color-mix(in srgb, var(--state-color) 16%, transparent), transparent 70%),
      linear-gradient(180deg, #123044 0%, #0b2232 40%, var(--bg) 100%);
    transition: background 600ms ease;
  }

  /* ---------- progress rail ---------- */
  .rail{
    height: 6px;
    flex: none;
    background: var(--grid-line);
    position: relative;
  }
  .rail-fill{
    position: absolute;
    inset: 0 0 0 auto;
    width: var(--remaining, 100%);
    background: var(--state-color);
    box-shadow: 0 0 12px 1px color-mix(in srgb, var(--state-color) 70%, transparent);
    transition: width 1s linear, background 600ms ease;
  }

  /* ---------- main ---------- */
  main{
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(0.5rem, 2vh, 1.5rem);
    min-height: 0;
    padding: 2vh 4vw;
  }

  .brand{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(0.35rem, 1.2vmin, 0.7rem);
  }
  .brand-logo{
    height: clamp(5.4rem, 18vmin, 10.5rem);
    width: clamp(5.4rem, 18vmin, 10.5rem);
    object-fit: cover;
    border-radius: 50%;
    background: #fff;
    display: block;
    box-shadow:
      0 0 0 3px color-mix(in srgb, var(--state-color) 40%, transparent),
      0 0 28px color-mix(in srgb, var(--state-color) 32%, transparent);
    transition: box-shadow 600ms ease;
  }
  .brand-text{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.2em;
  }
  .session-label{
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: clamp(0.62rem, 1.6vmin, 0.8rem);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .state-chip{
    display: inline-flex;
    align-items: center;
    gap: 0.55em;
    padding: 0.5em 1.1em;
    border-radius: 999px;
    background: var(--state-dim);
    color: var(--state-color);
    border: 1px solid color-mix(in srgb, var(--state-color) 45%, transparent);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: clamp(0.75rem, 1.6vw, 1.05rem);
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    transition: color 500ms ease, background 500ms ease, border-color 500ms ease;
  }
  .state-chip .dot{
    width: 0.55em;
    height: 0.55em;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 8px 1px currentColor;
  }
  .state-chip.pulse .dot{ animation: dotPulse 1s ease-in-out infinite; }

  .clock{
    font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-size: clamp(3rem, 19vmin, 13rem);
    line-height: 0.95;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    text-shadow: 0 0 60px color-mix(in srgb, var(--state-color) 22%, transparent);
    transition: text-shadow 600ms ease;
    user-select: none;
    -webkit-user-select: none;
  }
  .clock.critical{ color: var(--state-color); }
  .clock.tick-flash{ animation: tickFlash 900ms ease-in-out infinite; }

  .sub-row{
    display: flex;
    align-items: center;
    gap: 1.4em;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: clamp(0.75rem, 1.4vw, 1rem);
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }
  .sub-row b{ color: var(--text-primary); font-weight: 600; }

  /* ---------- presets (idle only) ---------- */
  .presets{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.6em;
    max-width: min(90vw, 640px);
  }
  .preset{
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: clamp(0.8rem, 1.5vw, 0.95rem);
    padding: 0.5em 0.95em;
    border-radius: 8px;
    border: 1px solid var(--grid-line);
    background: var(--panel);
    color: var(--text-muted);
    cursor: pointer;
    transition: border-color 150ms ease, color 150ms ease, background 150ms ease;
  }
  .preset:hover{ border-color: color-mix(in srgb, var(--c-safe) 50%, var(--grid-line)); color: var(--text-primary); }
  .preset.active{
    color: var(--bg);
    background: var(--c-safe);
    border-color: var(--c-safe);
    font-weight: 600;
  }
  .preset:focus-visible, button:focus-visible, .icon-btn:focus-visible, .custom-time input:focus-visible{
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .custom-time{
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 0.45em 0.55em;
    max-width: min(90vw, 640px);
  }
  .custom-time-label{
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: clamp(0.72rem, 1.4vw, 0.85rem);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .custom-time input{
    width: 4.6em;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: clamp(0.85rem, 1.5vw, 1rem);
    font-variant-numeric: tabular-nums;
    text-align: center;
    padding: 0.5em 0.35em;
    border-radius: 8px;
    border: 1px solid var(--grid-line);
    background: var(--panel);
    color: var(--text-primary);
    outline: none;
  }
  .custom-time input:hover{ border-color: color-mix(in srgb, var(--c-safe) 50%, var(--grid-line)); }
  .custom-time input:focus{
    border-color: var(--focus);
  }
  .custom-sep{
    color: var(--text-muted);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: clamp(0.72rem, 1.3vw, 0.82rem);
  }
  .custom-time.active input{
    border-color: var(--c-safe);
    color: var(--text-primary);
  }
  .custom-time.is-locked{
    opacity: 0.45;
    pointer-events: none;
  }

  /* ---------- controls ---------- */
  .controls{
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(0.6rem, 1.6vw, 1.1rem);
    padding: clamp(0.9rem, 2.4vh, 1.6rem) 1rem calc(clamp(0.9rem, 2.4vh, 1.6rem) + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--grid-line);
    background: color-mix(in srgb, var(--panel) 80%, transparent);
  }

  .btn{
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-size: clamp(0.85rem, 1.6vw, 1rem);
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 0.7em 1.5em;
    border-radius: 10px;
    border: 1px solid var(--grid-line);
    background: var(--panel);
    color: var(--text-primary);
    cursor: pointer;
    transition: transform 100ms ease, border-color 150ms ease, background 150ms ease, color 150ms ease;
  }
  .btn:hover{ border-color: color-mix(in srgb, var(--state-color) 55%, var(--grid-line)); }
  .btn:active{ transform: scale(0.97); }
  .btn.primary{
    background: var(--c-safe);
    border-color: var(--c-safe);
    color: var(--ink);
  }
  .btn.primary.running{
    background: var(--c-warn);
    border-color: var(--c-warn);
    color: #2a2205;
  }
  .btn.ghost{ background: transparent; }
  .btn[disabled]{ opacity: 0.4; cursor: not-allowed; }

  .icon-btn{
    width: 2.6em;
    height: 2.6em;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    border: 1px solid var(--grid-line);
    background: var(--panel);
    color: var(--text-muted);
    cursor: pointer;
    font-size: 1rem;
    transition: color 150ms ease, border-color 150ms ease;
  }
  .icon-btn:hover{ color: var(--text-primary); border-color: color-mix(in srgb, var(--state-color) 55%, var(--grid-line)); }
  .icon-btn svg{ width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn.muted{ color: var(--text-faint); }

  .hint{
    position: absolute;
    top: 14px;
    right: 18px;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    text-align: right;
    line-height: 1.6;
  }
  .hint kbd{
    font-family: inherit;
    border: 1px solid var(--grid-line);
    border-radius: 4px;
    padding: 0 0.35em;
    color: var(--text-muted);
  }

  /* ---------- flash overlay ---------- */
  .flash-overlay{
    position: fixed;
    inset: 0;
    background: var(--state-color);
    opacity: 0;
    pointer-events: none;
    mix-blend-mode: screen;
    z-index: 5;
  }
  .flash-overlay.flashing{
    animation: flashPulse 480ms ease-in-out var(--flash-count, 3);
  }

  @keyframes flashPulse{
    0%, 100%{ opacity: 0; }
    50%{ opacity: 0.55; }
  }
  @keyframes dotPulse{
    0%, 100%{ opacity: 1; transform: scale(1); }
    50%{ opacity: 0.35; transform: scale(0.75); }
  }
  @keyframes tickFlash{
    0%, 100%{ opacity: 1; }
    50%{ opacity: 0.45; }
  }

  @media (prefers-reduced-motion: reduce){
    .flash-overlay.flashing{ animation: none; opacity: 0.4; }
    .clock.tick-flash{ animation: none; }
    .state-chip.pulse .dot{ animation: none; }
    .rail-fill{ transition: none; }
  }

  @media (max-width: 480px){
    .hint{ display: none; }
    .sub-row{ flex-wrap: wrap; justify-content: center; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="rail"><div class="rail-fill" id="railFill"></div></div>

  <div class="hint">
    <div><kbd>Space</kbd> start / pause</div>
    <div><kbd>R</kbd> reset &nbsp; <kbd>F</kbd> fullscreen</div>
  </div>

  <main>
    <div class="brand">
      <img class="brand-logo" src="https://nautilusshipping.blr1.cdn.digitaloceanspaces.com/naavik-manthan.jpg" alt="Naavik Manthan" onerror="this.onerror=null;this.src='naavik-manthan.jpg'">
      <div class="brand-text">
        <div class="session-label">Speaker Timer</div>
      </div>
    </div>

    <div class="state-chip" id="stateChip"><span class="dot"></span><span id="stateText">Ready</span></div>

    <div class="clock" id="clock" aria-live="off">20:00</div>

    <div class="sub-row">
      <span>Total <b id="totalLabel">20:00</b></span>
      <span aria-hidden="true">&middot;</span>
      <span id="elapsedRow">Elapsed <b id="elapsedLabel">0:00</b></span>
    </div>

    <div class="presets" id="presets">
      <button class="preset" data-min="5">5 min</button>
      <button class="preset" data-min="10">10 min</button>
      <button class="preset" data-min="15">15 min</button>
      <button class="preset active" data-min="20">20 min</button>
      <button class="preset" data-min="30">30 min</button>
      <button class="preset" data-min="45">45 min</button>
      <button class="preset" data-min="60">60 min</button>
    </div>

    <form class="custom-time" id="customTime" autocomplete="off" novalidate>
      <span class="custom-time-label">Custom</span>
      <input type="text" id="customMin" inputmode="numeric" maxlength="3" value="20" aria-label="Minutes" placeholder="0">
      <span class="custom-sep">min</span>
      <input type="text" id="customSec" inputmode="numeric" maxlength="2" value="00" aria-label="Seconds" placeholder="00">
      <span class="custom-sep">sec</span>
      <button type="submit" class="preset" id="customSet">Set</button>
    </form>
  </main>

  <div class="controls">
    <button class="btn primary" id="startBtn">Start</button>
    <button class="btn ghost" id="resetBtn">Reset</button>
    <button class="icon-btn" id="soundBtn" title="Toggle sound" aria-label="Toggle sound">
      <svg id="soundIcon" viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
    </button>
    <button class="icon-btn" id="fullscreenBtn" title="Toggle fullscreen" aria-label="Toggle fullscreen">
      <svg viewBox="0 0 24 24"><path d="M8 4H4v4M16 4h4v4M8 20H4v-4M16 20h4v-4"/></svg>
    </button>
  </div>

  <div class="flash-overlay" id="flashOverlay"></div>
  <div id="srAnnounce" aria-live="assertive" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);"></div>
</div>

<script>
(function(){
  var els = {
    stage: document.getElementById('stage'),
    clock: document.getElementById('clock'),
    railFill: document.getElementById('railFill'),
    stateChip: document.getElementById('stateChip'),
    stateText: document.getElementById('stateText'),
    totalLabel: document.getElementById('totalLabel'),
    elapsedLabel: document.getElementById('elapsedLabel'),
    presets: document.getElementById('presets'),
    customTime: document.getElementById('customTime'),
    customMin: document.getElementById('customMin'),
    customSec: document.getElementById('customSec'),
    customSet: document.getElementById('customSet'),
    startBtn: document.getElementById('startBtn'),
    resetBtn: document.getElementById('resetBtn'),
    soundBtn: document.getElementById('soundBtn'),
    soundIcon: document.getElementById('soundIcon'),
    fullscreenBtn: document.getElementById('fullscreenBtn'),
    flashOverlay: document.getElementById('flashOverlay'),
    srAnnounce: document.getElementById('srAnnounce')
  };

  var STATES = {
    safe:     { color: '--c-safe',     dim: '--c-safe-dim',     label: 'On time' },
    warn:     { color: '--c-warn',     dim: '--c-warn-dim',     label: '5 minutes left' },
    alert:    { color: '--c-alert',    dim: '--c-alert-dim',    label: '2 minutes left' },
    critical: { color: '--c-critical', dim: '--c-critical-dim', label: '1 minute left' },
    done:     { color: '--c-critical', dim: '--c-critical-dim', label: "Time's up" }
  };

  var totalSeconds = 20 * 60;
  var remaining = totalSeconds;
  var running = false;
  var timerId = null;
  var lastTickAt = null;
  var soundOn = true;
  var audioCtx = null;
  var passedThresholds = {};
  var currentStateKey = 'safe';

  function fmt(s){
    s = Math.max(0, Math.round(s));
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function thresholdsFor(total){
    return [300, 120, 60].filter(function(t){ return t < total; });
  }

  function stateForRemaining(rem, total){
    var th = thresholdsFor(total);
    if (rem <= 0) return 'done';
    if (rem <= 60) return 'critical';
    if (th.indexOf(120) !== -1 && rem <= 120) return 'alert';
    if (th.indexOf(300) !== -1 && rem <= 300) return 'warn';
    return 'safe';
  }

  function applyState(key, announce){
    currentStateKey = key;
    var s = STATES[key];
    els.stage.style.setProperty('--state-color', 'var(' + s.color + ')');
    els.stage.style.setProperty('--state-dim', 'var(' + s.dim + ')');
    els.stateText.textContent = s.label;
    els.stateChip.classList.toggle('pulse', key === 'critical' || key === 'done');
    els.clock.classList.toggle('critical', key !== 'safe');
    els.clock.classList.toggle('tick-flash', key === 'done');
    if (announce) els.srAnnounce.textContent = s.label;
  }

  function render(){
    els.clock.textContent = fmt(remaining);
    els.elapsedLabel.textContent = fmt(totalSeconds - remaining);
    var pct = totalSeconds > 0 ? (remaining / totalSeconds) * 100 : 0;
    els.railFill.style.setProperty('--remaining', pct + '%');
    document.title = (running ? fmt(remaining) + ' – ' : '') + 'Speaker Timer';
  }

  function ensureAudio(){
    if (!audioCtx){
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
    return audioCtx;
  }

  function beep(freq, delay){
    if (!soundOn) return;
    var ctx = ensureAudio();
    if (!ctx) return;
    var t0 = ctx.currentTime + delay;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.22, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.32);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.34);
  }

  function flash(times, freq){
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    els.flashOverlay.style.setProperty('--flash-count', times);
    els.flashOverlay.classList.remove('flashing');
    if (!reduced){
      void els.flashOverlay.offsetWidth;
      els.flashOverlay.classList.add('flashing');
    }
    for (var i = 0; i < times; i++){
      beep(freq, i * 0.48);
    }
  }

  function triggerWarningEffects(key){
    if (key === 'warn') flash(3, 880);
    else if (key === 'alert') flash(4, 990);
    else if (key === 'critical') flash(5, 1180);
    else if (key === 'done') flash(8, 1400);
  }

  function tick(){
    var now = Date.now();
    var delta = (now - lastTickAt) / 1000;
    lastTickAt = now;
    remaining -= delta;
    if (remaining <= 0){
      remaining = 0;
      render();
      var doneKey = 'done';
      if (currentStateKey !== doneKey){
        applyState(doneKey, true);
        triggerWarningEffects(doneKey);
      }
      stopInterval();
      running = false;
      updateStartBtn();
      return;
    }
    var key = stateForRemaining(remaining, totalSeconds);
    if (key !== currentStateKey){
      applyState(key, true);
      if (!passedThresholds[key]){
        passedThresholds[key] = true;
        triggerWarningEffects(key);
      }
    }
    render();
  }

  function startInterval(){
    lastTickAt = Date.now();
    timerId = setInterval(tick, 200);
  }
  function stopInterval(){
    if (timerId){ clearInterval(timerId); timerId = null; }
  }

  function updateStartBtn(){
    els.startBtn.textContent = running ? 'Pause' : (remaining < totalSeconds && remaining > 0 ? 'Resume' : 'Start');
    els.startBtn.classList.toggle('running', running);
    els.customTime.classList.toggle('is-locked', running);
  }

  function syncDurationControls(secs, keepInputs){
    var mins = Math.floor(secs / 60);
    var sec = secs % 60;
    if (!keepInputs){
      els.customMin.value = String(mins);
      els.customSec.value = sec < 10 ? '0' + sec : String(sec);
    }
    var matched = false;
    Array.prototype.forEach.call(els.presets.children, function(btn){
      var isMatch = parseInt(btn.dataset.min, 10) === mins && sec === 0;
      btn.classList.toggle('active', isMatch);
      if (isMatch) matched = true;
    });
    els.customTime.classList.toggle('active', !matched);
    els.customSet.classList.toggle('active', !matched);
  }

  function setDurationSeconds(secs, keepInputs){
    if (running) return;
    secs = Math.max(1, Math.round(secs));
    totalSeconds = secs;
    remaining = totalSeconds;
    passedThresholds = {};
    applyState('safe', false);
    els.totalLabel.textContent = fmt(totalSeconds);
    syncDurationControls(totalSeconds, keepInputs);
    render();
  }

  function digitsOnly(value, maxLen){
    return String(value || '').replace(/\D/g, '').slice(0, maxLen);
  }

  function parseCustomDuration(){
    var mins = parseInt(digitsOnly(els.customMin.value, 3), 10);
    var secs = parseInt(digitsOnly(els.customSec.value, 2), 10);
    if (isNaN(mins)) mins = 0;
    if (isNaN(secs)) secs = 0;
    mins = Math.max(0, Math.min(999, mins));
    secs = Math.max(0, Math.min(59, secs));
    var total = mins * 60 + secs;
    return total < 1 ? 1 : total;
  }

  function applyCustomDuration(keepInputs){
    if (running) return;
    setDurationSeconds(parseCustomDuration(), keepInputs);
  }

  function start(){
    if (running || remaining <= 0) return;
    if (remaining === totalSeconds){
      var custom = parseCustomDuration();
      if (custom !== totalSeconds) setDurationSeconds(custom);
    }
    if (remaining <= 0) return;
    running = true;
    ensureAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    startInterval();
    updateStartBtn();
  }
  function pause(){
    if (!running) return;
    running = false;
    stopInterval();
    updateStartBtn();
  }
  function reset(){
    running = false;
    stopInterval();
    els.flashOverlay.classList.remove('flashing');
    setDurationSeconds(totalSeconds);
    updateStartBtn();
  }

  els.startBtn.addEventListener('click', function(){ running ? pause() : start(); });
  els.resetBtn.addEventListener('click', reset);

  els.presets.addEventListener('click', function(e){
    var btn = e.target.closest('.preset');
    if (!btn || running) return;
    setDurationSeconds(parseInt(btn.dataset.min, 10) * 60);
  });

  els.customTime.addEventListener('submit', function(e){
    e.preventDefault();
    applyCustomDuration(false);
  });

  function onCustomFieldInput(e){
    var field = e.target;
    var maxLen = field === els.customMin ? 3 : 2;
    var cleaned = digitsOnly(field.value, maxLen);
    if (field.value !== cleaned) field.value = cleaned;
    applyCustomDuration(true);
  }

  els.customMin.addEventListener('input', onCustomFieldInput);
  els.customSec.addEventListener('input', onCustomFieldInput);
  els.customMin.addEventListener('change', function(){ applyCustomDuration(false); });
  els.customSec.addEventListener('change', function(){ applyCustomDuration(false); });
  els.customMin.addEventListener('focus', function(){ els.customMin.select(); });
  els.customSec.addEventListener('focus', function(){ els.customSec.select(); });
  els.customSet.addEventListener('click', function(e){
    e.preventDefault();
    applyCustomDuration(false);
  });

  els.soundBtn.addEventListener('click', function(){
    soundOn = !soundOn;
    els.soundBtn.classList.toggle('muted', !soundOn);
    els.soundIcon.innerHTML = soundOn
      ? '<path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/>'
      : '<path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16 9l5 5M21 9l-5 5"/>';
  });

  els.fullscreenBtn.addEventListener('click', function(){
    try{
      if (!document.fullscreenElement){
        (document.documentElement.requestFullscreen || function(){}).call(document.documentElement);
      } else {
        document.exitFullscreen();
      }
    }catch(e){ /* fullscreen not available in this context */ }
  });

  document.addEventListener('keydown', function(e){
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (e.code === 'Space'){ e.preventDefault(); running ? pause() : start(); }
    else if (e.key === 'r' || e.key === 'R'){ reset(); }
    else if (e.key === 'f' || e.key === 'F'){ els.fullscreenBtn.click(); }
  });

  setDurationSeconds(20 * 60);
  updateStartBtn();
})();
</script>
</body>
</html>
